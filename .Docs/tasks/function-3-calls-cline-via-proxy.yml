function:
  number: 3
  name: "Calls Cline via Proxy"
  purpose: "Sends the formatted prompt to Cline via an HTTP proxy and retrieves Orion's response."

resources:
  http_proxy_server: "Running on VM at 192.168.0.4:9001"
  proxy_endpoint: "POST /orion"
  proxy_configuration:
    url: "http://192.168.0.4:9001/orion"
    timeout: "120 seconds (configurable)"
    instance_management: "The proxy handles checking/starting Cline instances"
  command_construction_logic: "executeCline() method in wrapper"

proxy_request_structure:
  json: |
    {
      "instance": "127.0.0.1:38937",
      "context": "system prompt string",
      "clineCommand": ["cline", "task", "new", "--mode", "plan", "--output-format", "json", "--no-interactive", "prompt text"]
    }

proxy_response_structure:
  json: |
    {
      "exitCode": 0,
      "stdout": "Cline output including JSON response",
      "stderr": "",
      "timestamp": "ISO 8601 string"
    }

test_cases:
  - "Should successfully send request to proxy and receive response."
  - "Should handle proxy timeouts gracefully."
  - "Should handle proxy errors (non-200 responses)."
  - "Should extract JSON from stdout (using regex if needed)."

